<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DAILY-SF">
<meta name="theme-color" content="#eef0f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<title>毎日のSF短編</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="setup" class="wrap" hidden>
  <h1 class="brand">毎日のSF短編</h1>
  <p class="lead">非公開の本棚（DAILY-SF-data）を読む鍵を、この iPhone に一度だけ貼ります。作り方は Mac の「iPhoneの入れ方.md」の 5 にあります。</p>
  <label class="field" for="token">鍵（github_pat_…）</label>
  <input id="token" class="input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_">
  <button type="button" class="pill solid" id="save-token">覚えて読み直す</button>
  <p class="note" id="setup-note" hidden></p>
</main>

<main id="list" class="wrap" hidden>
  <div class="head">
    <h1 class="brand">毎日のSF短編</h1>
    <button type="button" class="tbtn" id="gear" aria-label="つなぎ方">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <p class="lead" id="updated"></p>
  <div id="shelves"></div>
  <p class="note" id="list-note" hidden></p>
</main>

<div id="reader" hidden>
  <div class="top"><div class="wrap top-in">
    <button type="button" class="tbtn back" data-back aria-label="本棚へ戻る">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>本棚
    </button>
    <span class="vv" id="vv"></span>
    <div class="size">
      <button type="button" class="tbtn follow" id="follow" aria-pressed="true" aria-label="読んでいる文を画面で追う">追う</button>
      <button type="button" class="tbtn" id="smaller" aria-label="文字を小さくする">小</button>
      <button type="button" class="tbtn" id="larger" aria-label="文字を大きくする">大</button>
    </div>
  </div></div>
  <div class="wrap">
    <article id="article"></article>
    <div class="long" id="long-box" hidden>
      <p class="long-q" id="long-q"></p>
      <button type="button" class="pill" id="long-btn">長編にする</button>
    </div>
    <button type="button" class="pill back-end" data-back>本棚へ戻る</button>
  </div>
  <div class="bar">
    <div class="meter"><i id="meter"></i></div>
    <div class="wrap bar-in">
      <div class="keys">
        <button type="button" class="rate" id="rate" aria-label="読む速さを変える">1.0倍</button>
        <button type="button" class="ibtn" id="prev" aria-label="前の文へ">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2.4v14H6zM20 5.6v12.8L9.8 12z"/></svg>
        </button>
        <button type="button" class="play" id="play" aria-label="朗読を始める">
          <svg id="i-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15L20 12z"/></svg>
          <svg id="i-stop" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4.4v14H6zM13.6 5H18v14h-4.4z"/></svg>
        </button>
        <button type="button" class="ibtn" id="next" aria-label="次の文へ">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.6 5H18v14h-2.4zM4 5.6v12.8L14.2 12z"/></svg>
        </button>
        <span class="count" id="count">1 / 1文</span>
      </div>
      <p class="note" id="note" hidden></p>
    </div>
  </div>
</div>

<div id="gear-panel" class="panel" hidden>
  <div class="wrap">
    <h2 class="panel-h">つなぎ方</h2>
    <p class="note">本棚：editroom1980/DAILY-SF-data（非公開）。鍵はこの iPhone の中にだけあります。</p>
    <p class="note" id="push-state"></p>
    <button type="button" class="pill solid" id="push">新しい短編を知らせる</button>
    <button type="button" class="pill" id="reload">読み直す</button>
    <button type="button" class="pill" id="forget">この iPhone の鍵を消す</button>
    <button type="button" class="pill" id="gear-close">閉じる</button>
  </div>
</div>

<audio id="snd" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
